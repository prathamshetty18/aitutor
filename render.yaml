services:
  - type: web
    name: ai-tutor-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: FRONTEND_ORIGIN
        value: https://aitutor-nine-eosin.vercel.app
      - key: ACCEPTED_AUDIO_FORMATS
        value: wav

